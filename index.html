<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>User Agent MPD-M3U8 Tester</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer" />
    
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3159/3159073.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <script src="//ssl.p.jwpcdn.com/player/v/8.26.0/jwplayer.js"></script>
    <script>jwplayer.key = "XSuP4qMl+9tK17QNb+4+th2Pm9AWgMO/cYH8CI0HGGr7bdjo";</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        
        /* إخفاء أيقونات المشغل التي لا نحتاجها لضمان نظافة الشريط (كودك الأصلي) */
        .jw-icon-playlist, .jw-icon-next, .jw-related-btn { display: none !important; }

        /* كود أيقونة ملء الشاشة المربع المتقطع المتغير (كودك الأصلي) */
        .jw-icon-fullscreen svg { display: none !important; }
        .jw-icon-fullscreen {
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCI+PHBhdGggZD0iTTggM0g1YTIgMiAwIDAgMC0yIDJ2M20xOCAwVjVhMiAyIDAgMCAwLTItMmgtM20wIDE4aDNhMiAyIDAgMCAwIDItMnYtM00zIDE2djNhMiAyIDAgMCAwIDIgMmgzIj48L3BhdGg+PC9zdmc+');
            background-size: 16px;
            background-position: center;
            background-repeat: no-repeat;
        }
        .jw-flag-fullscreen .jw-icon-fullscreen {
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCI+PHBhdGggZD0iTTggM3YzYTIgMiAwIDAgMS0yIDJIM20xOCAwaC0zYTIgMiAwIDAgMS0yLTJWM20wIDE4di0zYTIgMiAwIDAgMSAyLTJoM00zIDE2aDNhMiAyIDAgMCAxIDIgMnYzIj48L3BhdGg+PC9zdmc+');
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden bg-[#0f172a]">

    <!-- Header / شريط العنوان -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-2.5 flex items-center justify-between shadow-lg flex-shrink-0">
        <div class="flex items-center gap-3">
            <div class="bg-blue-600/20 text-blue-400 p-2 rounded-xl border border-blue-500/30">
                <i class="fa-solid fa-flask-vial text-lg"></i>
            </div>
            <div>
                <h1 class="text-base font-bold text-white flex items-center gap-2">
                    User Agent MPD-M3U8 Tester
                    <span class="text-[10px] font-normal bg-blue-500/10 text-blue-400 px-1.5 py-0.5 rounded border border-blue-500/20">v1.5</span>
                </h1>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="copyAllLines()" class="bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 p-2 rounded-lg text-sm transition" title="نسخ جميع أسطر الكود">
                <i class="fa-solid fa-copy"></i>
            </button>
            <button onclick="clearAll()" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 p-2 rounded-lg text-sm transition" title="مسح الكل">
                <i class="fa-solid fa-trash-can"></i>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 flex flex-col gap-4 p-4 overflow-y-auto">
        
        <!-- 1. Textarea / Bulk Parser Box -->
        <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 shadow-sm flex-shrink-0">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-xs font-bold text-emerald-400 flex items-center gap-2">
                    <i class="fa-solid fa-code"></i> استخراج وتجربة أكواد وقوائم كاملة
                </h2>
                <span class="text-[10px] text-gray-400">يدعم Kodi M3U, JS Objects, Links</span>
            </div>
            <div class="flex gap-3">
                <textarea id="bulkInput" rows="3" placeholder="ألصق كود قنوات كامل، أسطر Kodi، أو روابط هنا..." class="flex-1 bg-slate-950 border border-slate-800 text-xs text-gray-300 p-2.5 rounded-lg focus:outline-none focus:border-emerald-500 font-mono transition resize-none"></textarea>
                <button onclick="parseAndLoadChannels()" class="w-32 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg text-xs transition flex flex-col items-center justify-center gap-1.5 shadow-lg shadow-emerald-900/20">
                    <i class="fa-solid fa-wand-magic-sparkles text-lg"></i> استخراج
                </button>
            </div>
        </div>

        <!-- 2. Direct Single Input Box -->
        <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 shadow-sm flex-shrink-0">
            <h2 class="text-xs font-bold text-blue-400 flex items-center gap-2 mb-3">
                <i class="fa-solid fa-bolt"></i> إدخال واختبار سريع
            </h2>
            
            <div class="flex items-center gap-2">
                <div class="flex-[3]">
                    <input type="text" id="singleUrl" placeholder="رابط البث (MPD / M3U8)..." class="w-full bg-slate-950 border border-slate-800 text-[11px] text-white p-2 rounded-md focus:outline-none focus:border-blue-500 transition font-mono">
                </div>
                <div class="flex-[1.5]">
                    <input type="text" id="singleK1" placeholder="Key ID (k1)..." class="w-full bg-slate-950 border border-slate-800 text-[11px] text-white p-2 rounded-md focus:outline-none focus:border-blue-500 transition font-mono">
                </div>
                <div class="flex-[1.5]">
                    <input type="text" id="singleK2" placeholder="Key Value (k2)..." class="w-full bg-slate-950 border border-slate-800 text-[11px] text-white p-2 rounded-md focus:outline-none focus:border-blue-500 transition font-mono">
                </div>
                <div class="flex-[2]">
                    <input type="text" id="uaInput" value="Mozilla/5.0 (Smart-TV; Linux; Tizen 6.0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/85.0.4183.102 TV Safari/537.36" title="User-Agent" class="w-full bg-slate-950 border border-slate-800 text-[11px] text-emerald-400 p-2 rounded-md focus:outline-none focus:border-emerald-500 font-mono transition">
                </div>
                <div class="flex-none">
                    <button onclick="playSingleLink()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded-md text-[11px] transition flex items-center justify-center gap-1.5 h-full whitespace-nowrap">
                        <i class="fa-solid fa-play"></i> تشغيل
                    </button>
                </div>
            </div>
        </div>

        <!-- 3. Bottom Section: Player & Parsed Channels -->
        <div class="flex flex-1 gap-4 min-h-[350px]">
            
            <!-- Player Area -->
            <div class="flex-1 flex flex-col bg-slate-950 p-3 rounded-xl border border-slate-800 shadow-lg">
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center gap-2">
                        <span id="statusBadge" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-slate-800 text-gray-400 border border-slate-700">
                            <span class="w-2 h-2 rounded-full bg-gray-500"></span> غير متصل
                        </span>
                        <span id="activeChannelTitle" class="text-xs font-bold text-emerald-400 truncate max-w-[250px]"></span>
                    </div>
                    <button onclick="stopPlayer()" class="bg-slate-800 hover:bg-slate-700 text-gray-300 border border-slate-700 px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5">
                        <i class="fa-solid fa-stop text-rose-400"></i> إيقاف
                    </button>
                </div>

                <div class="flex-1 w-full bg-black rounded-lg border border-slate-800 overflow-hidden relative shadow-inner">
                    <div id="playerContainer" class="w-full h-full">
                        <div id="jwplayerDiv" style="width: 100%; height: 100%;"></div>
                    </div>
                </div>
            </div>

            <!-- Parsed Channels List -->
            <div id="parsedChannelsWrapper" class="hidden w-[360px] bg-slate-900 p-3 rounded-xl border border-slate-800 shadow-lg flex-col overflow-hidden flex-shrink-0">
                <div class="flex justify-between items-center border-b border-slate-800 pb-2 mb-2">
                    <h3 class="text-xs font-bold text-gray-300">القنوات المستخرجة (<span id="parsedCount" class="text-emerald-400">0</span>)</h3>
                </div>
                <div id="parsedList" class="flex-1 overflow-y-auto space-y-2 pr-1"></div>
            </div>

        </div>
    </main>

    <script>
        let currentPlayer = null;
        window.extractedChannelsList = []; 
        let customUA = document.getElementById('uaInput').value;
        let activeChannelIndex = -1;

        document.getElementById('uaInput').addEventListener('input', (e) => {
            customUA = e.target.value.trim();
        });

        (function() {
            var originalFetch = window.fetch;
            var originalXHR = window.XMLHttpRequest;
            window.fetch = function(url, options) {
                options = options || {}; options.headers = options.headers || {};
                options.headers['User-Agent'] = customUA;
                return originalFetch.call(this, url, options);
            };
            var XHROpen = originalXHR.prototype.open;
            originalXHR.prototype.open = function(method, url) {
                XHROpen.apply(this, arguments);
                this.setRequestHeader('User-Agent', customUA);
            };
        })();

        function setStatus(text, state) {
            const statusBadge = document.getElementById('statusBadge');
            let bg = 'bg-slate-800 text-gray-400 border-slate-700';
            let dot = 'bg-gray-500';

            if (state === 'playing') {
                bg = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30';
                dot = 'bg-emerald-500 animate-pulse';
            } else if (state === 'loading') {
                bg = 'bg-amber-500/10 text-amber-400 border-amber-500/30';
                dot = 'bg-amber-500 animate-ping';
            } else if (state === 'error') {
                bg = 'bg-rose-500/10 text-rose-400 border-rose-500/30';
                dot = 'bg-rose-500';
            }
            statusBadge.className = `inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold border ${bg}`;
            statusBadge.innerHTML = `<span class="w-2 h-2 rounded-full ${dot}"></span> ${text}`;
        }

        function copyToClipboard(text, e = null) {
            if(e) e.stopPropagation();
            navigator.clipboard.writeText(text);
        }

        function copyCodeLine(index, e) {
            e.stopPropagation();
            const ch = window.extractedChannelsList[index];
            const codeStr = `{ id: "${ch.name}", name: "${ch.name}", url: "${ch.url}", k1: "${ch.k1}", k2: "${ch.k2}" }`;
            copyToClipboard(codeStr);
        }

        function copyAllLines() {
            if(!window.extractedChannelsList || window.extractedChannelsList.length === 0) return;
            let textToCopy = window.extractedChannelsList.map((ch) =>
                `{ id: "${ch.name}", name: "${ch.name}", url: "${ch.url}", k1: "${ch.k1}", k2: "${ch.k2}" }`
            ).join(',\n');
            copyToClipboard(textToCopy);
            alert("تم نسخ أسطر الكود بنجاح!");
        }

        function playStream(name, url, k1, k2) {
            if (!url) return;
            document.getElementById('activeChannelTitle').innerText = name || 'رابط اختباري';
            setStatus('جاري التحميل...', 'loading');
            stopPlayer();

            const setupConfig = {
                file: url,
                width: "100%", height: "100%", autostart: true, stretching: "uniform"
            };
            if (k1 && k2) setupConfig.drm = { clearkey: { keyId: k1, key: k2 } };

            currentPlayer = jwplayer("jwplayerDiv").setup(setupConfig);

            currentPlayer.on('ready', function() {
                setStatus('يعمل الآن', 'playing');
                
                // كود الاسترتش الخاص بك الأصلي تماماً بدون أي تعديلات
                let isStretched = false;
                const diagonalCutArrow = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNMTQgMTBsNy03bS02IDBoNnY2bS0xMSA1bC03IDdtNiAwSDN2LTYiLz48L3N2Zz4=";
                
                currentPlayer.addButton(
                    diagonalCutArrow, "توسيع/تضييق الصورة", 
                    function() {
                        let videoEl = document.querySelector('.jw-video');
                        if (!isStretched) { 
                            currentPlayer.setConfig({ stretching: "exactfit" }); 
                            if(videoEl) { videoEl.style.objectFit = 'fill'; videoEl.style.width = '100%'; videoEl.style.height = '100%'; }
                            isStretched = true; 
                        } else { 
                            currentPlayer.setConfig({ stretching: "uniform" }); 
                            if(videoEl) { videoEl.style.objectFit = 'contain'; }
                            isStretched = false; 
                        }
                    }, "stretch-button"
                );
            });

            currentPlayer.on('audioTracks', function() {
                const tracks = currentPlayer.getAudioTracks();
                tracks.forEach((track, index) => {
                    if (track.label.toLowerCase().includes("ara") || track.label.includes("عربي")) {
                        currentPlayer.setCurrentAudioTrack(index);
                    }
                });
            });

            currentPlayer.on('error', function(e) { setStatus('فشل التشغيل', 'error'); });
        }

        function stopPlayer() {
            if (currentPlayer) { currentPlayer.remove(); currentPlayer = null; }
            setStatus('متوقف', 'idle');
            document.getElementById('activeChannelTitle').innerText = '';
        }

        function playSingleLink() {
            activeChannelIndex = -1;
            updateActiveChannelStyle();
            
            const url = document.getElementById('singleUrl').value.trim();
            const k1 = document.getElementById('singleK1').value.trim();
            const k2 = document.getElementById('singleK2').value.trim();
            playStream('اختبار سريّع', url, k1, k2);
        }

        function playParsedChannel(index) {
            activeChannelIndex = index;
            updateActiveChannelStyle();
            
            const ch = window.extractedChannelsList[index];
            playStream(ch.name, ch.url, ch.k1, ch.k2);
        }

        function updateActiveChannelStyle() {
            document.querySelectorAll('.channel-card').forEach(el => {
                el.classList.remove('bg-green-600', 'border-green-500', 'shadow-md');
                el.classList.add('bg-slate-950', 'border-slate-800', 'hover:bg-slate-800');
                
                const nameTxt = el.querySelector('.ch-name');
                if(nameTxt) { nameTxt.classList.remove('text-white'); nameTxt.classList.add('text-gray-200'); }
                
                const detailsTxt = el.querySelector('.ch-details');
                if(detailsTxt) { detailsTxt.classList.remove('text-green-100'); detailsTxt.classList.add('text-gray-500'); }
            });

            if(activeChannelIndex !== -1) {
                const activeCard = document.getElementById(`channelCard_${activeChannelIndex}`);
                if (activeCard) {
                    activeCard.classList.remove('bg-slate-950', 'border-slate-800', 'hover:bg-slate-800');
                    activeCard.classList.add('bg-green-600', 'border-green-500', 'shadow-md');
                    
                    const nameTxt = activeCard.querySelector('.ch-name');
                    if(nameTxt) { nameTxt.classList.remove('text-gray-200'); nameTxt.classList.add('text-white'); }
                    
                    const detailsTxt = activeCard.querySelector('.ch-details');
                    if(detailsTxt) { detailsTxt.classList.remove('text-gray-500'); detailsTxt.classList.add('text-green-100'); }
                }
            }
        }

        function parseInputText(text) {
            const channels = [];

            const jsArrayObjMatches = [...text.matchAll(/name\s*:\s*["']([^"']+)["']\s*,\s*url\s*:\s*["']([^"']+)["'](?:\s*,\s*k1\s*:\s*["']([^"']+)["'])?(?:\s*,\s*k2\s*:\s*["']([^"']+)["'])?/gi)];
            jsArrayObjMatches.forEach(m => {
                if (m[2] && !channels.some(c => c.url === m[2])) {
                    channels.push({ name: m[1].trim(), url: m[2], k1: m[3] || "", k2: m[4] || "" });
                }
            });

            const jsVarMatches = [...text.matchAll(/manifestUrl[^\n"']*["'](https?:\/\/[^"'\s]+)["'][\s\S]*?keyId[^\n"']*["']([a-fA-F0-9]{32})["'][\s\S]*?key2?[^\n"']*["']([a-fA-F0-9]{32})["']/gi)];
            jsVarMatches.forEach((m) => {
                if (!channels.some(c => c.url === m[1])) {
                    channels.push({ name: `قناة JS Variable ${channels.length + 1}`, url: m[1], k1: m[2], k2: m[3] });
                }
            });

            const mergedMatches = [...text.matchAll(/license_key=([a-fA-F0-9]{32}):([a-fA-F0-9]{32})(https?:\/\/[^\s"'\)]+)/gi)];
            mergedMatches.forEach((m) => {
                if (!channels.some(c => c.url === m[3])) {
                    channels.push({ name: `قناة Kodi Merged ${channels.length + 1}`, url: m[3], k1: m[1], k2: m[2] });
                }
            });

            const m3uBlocks = text.split('#EXTINF');
            m3uBlocks.forEach(block => {
                if (!block.trim()) return;
                const nameMatch = block.match(/,(.+?)(?:\r?\n|$)/);
                const keyMatch = block.match(/license_key=([a-fA-F0-9]{32}):([a-fA-F0-9]{32})/i);
                const urlMatch = block.match(/(https?:\/\/[^\s"'\)]+)/i);
                if (urlMatch && !channels.some(c => c.url === urlMatch[1])) {
                    channels.push({ name: nameMatch ? nameMatch[1].trim() : `قناة M3U ${channels.length + 1}`, url: urlMatch[1], k1: keyMatch ? keyMatch[1] : "", k2: keyMatch ? keyMatch[2] : "" });
                }
            });

            const jsObjMatches = [...text.matchAll(/["']([a-zA-Z0-9_\u0600-\u06FF\s-]+)["']\s*:\s*\{\s*url\s*:\s*["']([^"']+)["'](?:,\s*k1\s*:\s*["']([^"']+)["'])?(?:,\s*k2\s*:\s*["']([^"']+)["'])?/gi)];
            jsObjMatches.forEach(m => {
                if (m[2] && !channels.some(c => c.url === m[2])) {
                    channels.push({ name: m[1].trim(), url: m[2], k1: m[3] || "", k2: m[4] || "" });
                }
            });

            if (channels.length === 0) {
                const urls = text.match(/https?:\/\/[^\s"'\)]+/g) || [];
                const keys = text.match(/([a-fA-F0-9]{32})/g) || [];
                urls.forEach((url, i) => { channels.push({ name: `قناة مكتشفة ${i + 1}`, url: url, k1: keys[i * 2] || "", k2: keys[i * 2 + 1] || "" }); });
            }
            return channels;
        }

        function parseAndLoadChannels() {
            const rawText = document.getElementById('bulkInput').value;
            if (!rawText.trim()) return;

            window.extractedChannelsList = parseInputText(rawText);
            if (window.extractedChannelsList.length === 0) return;

            const wrapper = document.getElementById('parsedChannelsWrapper');
            const listContainer = document.getElementById('parsedList');
            document.getElementById('parsedCount').innerText = window.extractedChannelsList.length;
            listContainer.innerHTML = '';

            window.extractedChannelsList.forEach((ch, index) => {
                const card = document.createElement('div');
                card.id = `channelCard_${index}`;
                card.className = "channel-card p-2 bg-slate-950 hover:bg-slate-800 rounded-lg border border-slate-800 transition flex items-center justify-between cursor-pointer group";
                
                const hasDRM = ch.k1 && ch.k2;

                card.innerHTML = `
                    <div class="flex items-center gap-2 overflow-hidden flex-1" onclick="playParsedChannel(${index})">
                        <div class="truncate">
                            <div class="ch-name text-xs font-bold text-gray-200 transition truncate">${ch.name}</div>
                            <div class="ch-details text-[9px] text-gray-500 font-mono transition mt-0.5">${hasDRM ? 'DRM' : 'Free'} • #${index + 1}</div>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-1 flex-shrink-0">
                        <button onclick="copyToClipboard('${ch.url}', event)" title="نسخ الرابط" class="p-1.5 text-gray-400 hover:text-blue-400 rounded transition">
                            <i class="fa-solid fa-link text-[11px]"></i>
                        </button>
                        <button onclick="copyCodeLine(${index}, event)" title="نسخ سطر الكود" class="p-1.5 text-gray-400 hover:text-emerald-400 rounded transition">
                            <i class="fa-solid fa-code text-[11px]"></i>
                        </button>
                    </div>
                `;
                listContainer.appendChild(card);
            });

            wrapper.classList.remove('hidden');
            wrapper.classList.add('flex');
        }

        function clearAll() {
            stopPlayer();
            document.getElementById('singleUrl').value = '';
            document.getElementById('singleK1').value = '';
            document.getElementById('singleK2').value = '';
            document.getElementById('bulkInput').value = '';
            
            const wrapper = document.getElementById('parsedChannelsWrapper');
            wrapper.classList.add('hidden');
            wrapper.classList.remove('flex');
            
            document.getElementById('parsedList').innerHTML = '';
            window.extractedChannelsList = [];
            activeChannelIndex = -1;
        }
    </script>
</body>
</html>
